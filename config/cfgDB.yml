spring:
  # Настройки R2DBC (для основного приложения)
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/travel
    username: postgres
    password: postgres

  # Настройки Flyway (использует JDBC)
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/travel
    user: postgres
    password: postgres
